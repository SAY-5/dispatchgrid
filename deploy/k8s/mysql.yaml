apiVersion: v1
kind: Service
metadata:
  name: mysql-shard-0
spec:
  selector:
    app: mysql-shard-0
  ports:
    - port: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-shard-1
spec:
  selector:
    app: mysql-shard-1
  ports:
    - port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-shard-0
spec:
  serviceName: mysql-shard-0
  replicas: 1
  selector:
    matchLabels:
      app: mysql-shard-0
  template:
    metadata:
      labels:
        app: mysql-shard-0
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          args: ["--performance-schema=OFF", "--innodb-buffer-pool-size=128M", "--max-connections=200"]
          env:
            - name: MYSQL_DATABASE
              value: dispatch
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: dispatchgrid-env
                  key: SHARD_USERNAME
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dispatchgrid-shard-credentials
                  key: SHARD_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dispatchgrid-shard-credentials
                  key: MYSQL_ROOT_PASSWORD
          ports:
            - containerPort: 3306
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-shard-1
spec:
  serviceName: mysql-shard-1
  replicas: 1
  selector:
