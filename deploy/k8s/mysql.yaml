    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          args: ["--performance-schema=OFF", "--innodb-buffer-pool-size=128M", "--max-connections=200"]
          env:
            - name: MYSQL_DATABASE
              value: dispatch
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: dispatchgrid-env
                  key: SHARD_USERNAME
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dispatchgrid-shard-credentials
                  key: SHARD_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dispatchgrid-shard-credentials
                  key: MYSQL_ROOT_PASSWORD
          ports:
            - containerPort: 3306
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
