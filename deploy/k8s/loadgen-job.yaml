# Applied by scripts/k8s-e2e.sh; not part of the kustomization.
apiVersion: batch/v1
kind: Job
metadata:
  name: loadgen
  namespace: dispatchgrid
spec:
  backoffLimit: 0
  # The run is DURATION_SECONDS of load (240 by default, enough for the staged rolling update
  # to finish inside the load window) plus up to SETTLE_SECONDS of waiting for the last trips
  # to reach a terminal state, after seeding 600 drivers. 900 leaves room for all three on a
  # loaded host; it is not a way to let a stuck run pass, because the script fails the moment
  # the job reports Failed.
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      restartPolicy: Never
      containers:
        - name: loadgen
          image: dispatchgrid/loadgen:TAG_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          env:
            - name: RIDER_URL
              value: http://rider-request-service:8081
            - name: DRIVER_URL
              value: http://driver-location-service:8082
            - name: MATCHING_URL
              value: http://matching-service:8083
            - name: DURATION_SECONDS
              value: "DURATION_PLACEHOLDER"
            - name: SETTLE_SECONDS
              value: "180"
            - name: RIDES_PER_SECOND
              value: "10"
            - name: DRIVERS_PER_CITY
              value: "300"
            - name: SUMMARY_OUT
              value: /tmp/loadgen-summary.json
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # The generator runs one virtual thread per driver and per ride, and the JDK
              # HTTP client holds per-connection buffers outside the heap, so 512Mi was not
              # enough for 300 drivers per city: the container hit the limit and was killed.
              memory: 1Gi
