name: dispatchgrid

x-service-env: &service-env
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  REDIS_HOST: redis
  SHARD0_URL: jdbc:mysql://mysql-shard-0:3306/dispatch
  SHARD1_URL: jdbc:mysql://mysql-shard-1:3306/dispatch
  SHARD_USERNAME: dispatch
  SHARD_PASSWORD: dispatch

x-mysql: &mysql
  image: mysql:8.0
  command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=128M", "--max-connections=200"]
  environment:
    MYSQL_DATABASE: dispatch
    MYSQL_USER: dispatch
    MYSQL_PASSWORD: dispatch
    MYSQL_ROOT_PASSWORD: root
  healthcheck:
    test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
    interval: 5s
    timeout: 3s
    retries: 30

services:
  redpanda:
    image: redpandadata/redpanda:v24.3.18
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 3s
      retries: 30

  mysql-shard-0:
    <<: *mysql

  mysql-shard-1:
    <<: *mysql

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  rider-request-service:
    build:
      context: ..
      args:
        MODULE: rider-request-service
    image: dispatchgrid/rider-request-service:${TAG:-dev}
    environment:
      <<: *service-env
      PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      redpanda:
        condition: service_healthy
      mysql-shard-0:
        condition: service_healthy
      mysql-shard-1:
        condition: service_healthy

  driver-location-service:
    build:
      context: ..
      args:
        MODULE: driver-location-service
    image: dispatchgrid/driver-location-service:${TAG:-dev}
    environment:
      <<: *service-env
      PORT: "8082"
    ports:
      - "8082:8082"
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy

  matching-service:
    build:
      context: ..
      args:
        MODULE: matching-service
    image: dispatchgrid/matching-service:${TAG:-dev}
    environment:
      <<: *service-env
      PORT: "8083"
      STREAM_THREADS: "3"
      MATCH_CLAIM_TTL: ${MATCH_CLAIM_TTL:-20s}
    ports:
      - "8083:8083"
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql-shard-0:
        condition: service_healthy
      mysql-shard-1:
        condition: service_healthy

  loadgen:
    build:
      context: ..
      args:
        MODULE: loadgen
    image: dispatchgrid/loadgen:${TAG:-dev}
    profiles: ["loadgen"]
    environment:
      RIDER_URL: http://rider-request-service:8081
      DRIVER_URL: http://driver-location-service:8082
      MATCHING_URL: http://matching-service:8083
      DURATION_SECONDS: ${DURATION_SECONDS:-60}
      RIDES_PER_SECOND: ${RIDES_PER_SECOND:-10}
      DRIVERS_PER_CITY: ${DRIVERS_PER_CITY:-300}
      SUMMARY_OUT: /tmp/loadgen-summary.json
    depends_on:
      - rider-request-service
      - driver-location-service
      - matching-service
