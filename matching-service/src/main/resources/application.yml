server:
  port: ${PORT:8083}
  shutdown: graceful

spring:
  application:
    name: matching-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    streams:
      application-id: matching-service
      properties:
        num.stream.threads: ${STREAM_THREADS:3}
        processing.guarantee: at_least_once
        num.standby.replicas: 1
        group.instance.id: ${STREAMS_INSTANCE_ID:matching-local}
        session.timeout.ms: 20000
        commit.interval.ms: 200
        default.deserialization.exception.handler: org.apache.kafka.streams.errors.LogAndContinueExceptionHandler
        auto.offset.reset: earliest
        state.dir: ${STREAMS_STATE_DIR:/tmp/kafka-streams}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

dispatchgrid:
  shards:
    - name: shard-0
      url: ${SHARD0_URL:jdbc:mysql://localhost:3306/dispatch}
      username: ${SHARD_USERNAME:dispatch}
      password: ${SHARD_PASSWORD:dispatch}
    - name: shard-1
      url: ${SHARD1_URL:jdbc:mysql://localhost:3307/dispatch}
      username: ${SHARD_USERNAME:dispatch}
      password: ${SHARD_PASSWORD:dispatch}

matching:
  initial-radius-meters: ${MATCH_INITIAL_RADIUS_M:1000}
  radius-factor: 2.0
  max-radius-meters: ${MATCH_MAX_RADIUS_M:8000}
  candidates-per-radius: 20
  claim-ttl: ${MATCH_CLAIM_TTL:20s}

surge:
  cell-meters: ${SURGE_CELL_M:1000}
  demand-window: ${SURGE_DEMAND_WINDOW:60s}
  supply-ttl: ${SURGE_SUPPLY_TTL:15s}
  slope: 0.5
  max-multiplier: ${SURGE_MAX_MULTIPLIER:3.0}
  min-demand: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,kafka,redis,shards,streams
        liveness:
          include: livenessState
